version: 1
name: Git backup
description: Commit and push local changes when DeskCron starts.

triggers:
  - type: startup

steps:
  - name: Show changes
    run: git status --short
    save_as: changes

  - name: Stage changes
    run: git add --all

  - name: Commit changes
    run: git diff --cached --quiet || git commit -m "chore: local backup"

  - name: Push
    run: git push

  - notify:
      title: DeskCron
      message: Git backup completed
