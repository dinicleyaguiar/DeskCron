name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify
        run: npm run check

      - name: Pack
        run: npm pack

      - name: Checksums
        run: sha256sum deskcron-*.tgz > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" deskcron-*.tgz SHA256SUMS.txt --generate-notes --title "DeskCron ${GITHUB_REF_NAME}"
