name: Feature request
description: Propose a focused DeskCron improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What workflow or developer task is difficult today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Show a small YAML example when relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Security or compatibility notes
